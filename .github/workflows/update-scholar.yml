name: Update Scholar citations and publish homepage

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: homepage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install citation parser
        run: python -m pip install -r scripts/requirements.txt
      - name: Check citation parsing and failure handling
        run: python -m unittest discover -s tests -v
      - name: Sync selected publications from Google Scholar
        id: scholar
        continue-on-error: true
        run: python scripts/sync_scholar.py
      - name: Report unavailable sync
        if: steps.scholar.outcome == 'failure'
        run: echo 'Google Scholar could not be refreshed. The previous verified counts and timestamps were retained.' >> "$GITHUB_STEP_SUMMARY"
      - name: Build homepage
        run: python scripts/build.py
      - name: Save verified counts for future runs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/citations.json data/metrics.json index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified Google Scholar citations'
            git push
          fi
      - name: Prepare public site
        run: |
          mkdir -p _site/data
          cp index.html .nojekyll _site/
          cp -R assets _site/assets
          cp data/citations.json data/metrics.json _site/data/
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy updated homepage
        id: deployment
        uses: actions/deploy-pages@v4
